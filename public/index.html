<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropbox Bulk Signup Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 8V4H8"/>
                    <rect width="16" height="12" x="4" y="8" rx="2"/>
                    <path d="M2 14h2"/>
                    <path d="M20 14h2"/>
                    <path d="M15 13v2"/>
                    <path d="M9 13v2"/>
                </svg>
                Dropbox Bulk Signup
            </h1>
            <div style="display:flex;align-items:center;gap:0.75rem;">
                <button class="btn-history" id="history-btn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                        <path d="M12 7v5l4 2"/>
                    </svg>
                    Riwayat
                </button>
                <div class="version">v1.3.0 (Firefox)</div>
            </div>
        </header>

        <main class="grid">
            <!-- Left Panel: Form Input -->
            <section class="panel">
                <div class="panel-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    Parameter Konfigurasi
                </div>

                <div class="form-group">
                    <label for="dropbox-url">URL Dropbox / Referal</label>
                    <input type="text" id="dropbox-url" value="https://www.dropbox.com/register" placeholder="Masukkan URL Dropbox...">
                </div>

                <div class="form-group">
                    <label for="emails-list">Daftar Email Bulk (Pisahkan dengan titik koma ';')</label>
                    <textarea id="emails-list" placeholder="email1@domain.com; email2@domain.com; email3@domain.com;"></textarea>
                </div>

                <!-- Password Mode -->
                <div class="form-group">
                    <label>Mode Password</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="password-mode" value="random" id="pw-random" checked>
                            🎲 Acak (Random)
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="password-mode" value="fixed" id="pw-fixed">
                            🔒 Tetap (Fixed)
                        </label>
                    </div>
                    <div class="fixed-password-wrap" id="fixed-password-wrap">
                        <label for="fixed-password-input">Password Tetap</label>
                        <input type="text" id="fixed-password-input" value="Aa12345678*" placeholder="Masukkan password tetap...">
                    </div>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="use-proxy">
                    <label for="use-proxy">Gunakan Rotasi Proxy Singapura (SG)</label>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="use-headless" checked>
                    <label for="use-headless">Jalankan Tanpa Jendela (Headless Mode)</label>
                </div>
                <div class="btn-group">
                    <button class="btn" id="start-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="6 3 20 12 6 21 6 3"/>
                        </svg>
                        Mulai Pendaftaran
                    </button>
                    <button class="btn btn-danger" id="stop-btn" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                        </svg>
                        Hentikan
                    </button>
                </div>
            </section>

            <!-- Right Panel: Status Progress -->
            <section class="panel">
                <div class="panel-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.21 15.89A10 10 0 1 1 8 2.83"/>
                        <path d="M22 12A10 10 0 0 0 12 2v10z"/>
                    </svg>
                    Progress Peninjauan
                </div>

                <div class="progress-box">
                    <div class="progress-ring">
                        <svg width="120" height="120">
                            <defs>
                                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#a78bfa" />
                                    <stop offset="100%" stop-color="#6366f1" />
                                </linearGradient>
                            </defs>
                            <circle class="progress-ring-bg" cx="60" cy="60" r="50"></circle>
                            <circle class="progress-ring-indicator" id="progress-indicator" cx="60" cy="60" r="50" stroke-dasharray="314.16" stroke-dashoffset="314.16"></circle>
                        </svg>
                        <div class="progress-text" id="progress-percentage">0%</div>
                    </div>

                    <div class="status-badge status-idle" id="status-badge">
                        <span id="status-text">Standby</span>
                    </div>

                    <div style="font-size: 0.85rem; color: #a1a1aa; text-align: center;" id="progress-detail">
                        Menunggu input pendaftaran...
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card stat-success">
                            <div class="stat-value" id="stat-success-count">0</div>
                            <div class="stat-label">Sukses</div>
                        </div>
                        <div class="stat-card stat-failed">
                            <div class="stat-value" id="stat-failed-count">0</div>
                            <div class="stat-label">Gagal</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Real-time Log Console -->
            <section class="log-container">
                <div class="panel-title" style="justify-content: space-between;">
                    <span style="display: flex; align-items: center; gap: 0.5rem;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 17V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v11"/>
                            <path d="M12 20h.01"/>
                            <path d="M16 20h.01"/>
                            <path d="M8 20h.01"/>
                        </svg>
                        Log Konsol Real-time
                    </span>
                    <button id="clear-btn" style="background: none; border: none; color: #71717a; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                        Hapus Log
                    </button>
                </div>
                <div class="log-panel" id="log-panel">
                    <div class="log-line log-info">[Info] Dashboard siap. Silakan masukkan parameter pendaftaran.</div>
                </div>
            </section>
        </main>
    </div>

    <!-- ── History Modal ─────────────────────────────────── -->
    <div class="modal-backdrop" id="history-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>📋 Riwayat Pendaftaran</h2>
                <button class="modal-close" id="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div id="history-content">
                    <div class="empty-state">Memuat riwayat...</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-outline btn-sm" id="history-clear-btn">🗑 Hapus Semua Riwayat</button>
                <button class="btn btn-sm" id="history-refresh-btn">↻ Perbarui</button>
            </div>
        </div>
    </div>

    <script>
        const dropboxUrlInput     = document.getElementById('dropbox-url');
        const emailsListInput     = document.getElementById('emails-list');
        const useProxyCheckbox    = document.getElementById('use-proxy');
        const useHeadlessCheckbox = document.getElementById('use-headless');
        const startBtn            = document.getElementById('start-btn');
        const stopBtn             = document.getElementById('stop-btn');
        const clearBtn            = document.getElementById('clear-btn');
        const logPanel            = document.getElementById('log-panel');
        const progressIndicator   = document.getElementById('progress-indicator');
        const progressPercentage  = document.getElementById('progress-percentage');
        const statusBadge         = document.getElementById('status-badge');
        const statusText          = document.getElementById('status-text');
        const progressDetail      = document.getElementById('progress-detail');
        const successCountEl      = document.getElementById('stat-success-count');
        const failedCountEl       = document.getElementById('stat-failed-count');

        // Password mode
        const pwRandomRadio        = document.getElementById('pw-random');
        const pwFixedRadio         = document.getElementById('pw-fixed');
        const fixedPasswordWrap    = document.getElementById('fixed-password-wrap');
        const fixedPasswordInput   = document.getElementById('fixed-password-input');

        // History modal
        const historyBtn           = document.getElementById('history-btn');
        const historyModal         = document.getElementById('history-modal');
        const modalCloseBtn        = document.getElementById('modal-close-btn');
        const historyContent       = document.getElementById('history-content');
        const historyRefreshBtn    = document.getElementById('history-refresh-btn');
        const historyClearBtn      = document.getElementById('history-clear-btn');

        // ── Password mode toggle ──────────────────────────────
        function updatePasswordModeUI() {
            const isFixed = pwFixedRadio.checked;
            fixedPasswordWrap.classList.toggle('visible', isFixed);
        }
        pwRandomRadio.addEventListener('change', updatePasswordModeUI);
        pwFixedRadio.addEventListener('change', updatePasswordModeUI);
        updatePasswordModeUI();

        // ── History modal ─────────────────────────────────────
        function formatDate(iso) {
            try {
                const d = new Date(iso);
                return d.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
            } catch (_) { return iso; }
        }

        async function loadHistory() {
            historyContent.innerHTML = '<div class="empty-state">Memuat riwayat...</div>';
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                if (!data.length) {
                    historyContent.innerHTML = '<div class="empty-state">Belum ada riwayat pendaftaran.</div>';
                    return;
                }
                const rows = data.map(r => `
                    <tr>
                        <td>${formatDate(r.timestamp)}</td>
                        <td>${r.email}</td>
                        <td>${r.password}</td>
                        <td><span class="badge-${r.status}">${r.status}</span></td>
                        <td style="font-size:0.75rem;color:#71717a;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${r.url}">${r.url}</td>
                    </tr>`).join('');
                historyContent.innerHTML = `
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Waktu</th>
                                <th>Email</th>
                                <th>Password</th>
                                <th>Status</th>
                                <th>URL</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>`;
            } catch (e) {
                historyContent.innerHTML = `<div class="empty-state">Gagal memuat riwayat: ${e.message}</div>`;
            }
        }

        historyBtn.addEventListener('click', () => {
            historyModal.classList.add('open');
            loadHistory();
        });

        modalCloseBtn.addEventListener('click', () => historyModal.classList.remove('open'));
        historyModal.addEventListener('click', (e) => { if (e.target === historyModal) historyModal.classList.remove('open'); });

        historyRefreshBtn.addEventListener('click', loadHistory);

        historyClearBtn.addEventListener('click', async () => {
            if (!confirm('Hapus semua riwayat pendaftaran?')) return;
            await fetch('/api/history', { method: 'DELETE' });
            loadHistory();
        });

        // ── WebSocket Connection ──────────────────────────────
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;
        let socket;

        function connectWebSocket() {
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                appendLog('log-success', '[System] Terhubung ke WebSockets server.');
                appendLog('log-info', `[Info] User Agent: ${navigator.userAgent}`);
                fetch('https://api.ipify.org?format=json')
                    .then(res => res.json())
                    .then(data => appendLog('log-info', `[Info] Public IP (client): ${data.ip}`))
                    .catch(() => {});
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'log') {
                    handleLogMessage(data.message);
                } else if (data.type === 'progress') {
                    updateProgress(data.current, data.total, data.status, data.successCount, data.failedCount);
                } else if (data.type === 'status') {
                    updateStatus(data.status);
                } else if (data.type === 'email_success') {
                    removeEmailFromUIList(data.email);
                }
            };

            socket.onclose = () => {
                appendLog('log-err', '[System] Koneksi WebSockets terputus. Mencoba menghubungkan kembali...');
                setTimeout(connectWebSocket, 3000);
            };
        }

        connectWebSocket();

        function removeEmailFromUIList(successEmail) {
            const rawText = emailsListInput.value;
            const emails = rawText.split(';')
                                  .map(e => e.trim())
                                  .filter(e => e.length > 0 && e.toLowerCase() !== successEmail.toLowerCase());
            emailsListInput.value = emails.join('; ') + (emails.length > 0 ? ';' : '');
        }

        function appendLog(className, text) {
            const line = document.createElement('div');
            line.className = `log-line ${className}`;
            line.innerText = text;
            logPanel.appendChild(line);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function handleLogMessage(msg) {
            let className = 'log-info';
            const lower = msg.toLowerCase();

            if (lower.includes('error') || lower.includes('gagal') || lower.includes('⚠️')) {
                className = 'log-err';
            } else if (lower.includes('berhasil') || lower.includes('✓') || lower.includes('selesai')) {
                className = 'log-success';
            } else if (lower.includes('peringatan') || lower.includes('warning')) {
                className = 'log-warn';
            } else if (lower.includes('===') || lower.includes('---')) {
                className = 'log-divider';
            }

            appendLog(className, msg);
        }

        function updateProgress(current, total, status, successCount, failedCount) {
            const pct = Math.round((current / total) * 100);
            progressPercentage.innerText = `${pct}%`;

            const offset = 314.16 - (314.16 * pct) / 100;
            progressIndicator.style.strokeDashoffset = offset;

            progressDetail.innerText = `Memproses email ke-${current} dari ${total} (${status})`;

            if (successCount !== undefined) successCountEl.innerText = successCount;
            if (failedCount !== undefined) failedCountEl.innerText = failedCount;
        }

        function setFormDisabled(disabled) {
            emailsListInput.disabled = disabled;
            dropboxUrlInput.disabled = disabled;
            useProxyCheckbox.disabled = disabled;
            useHeadlessCheckbox.disabled = disabled;
            pwRandomRadio.disabled = disabled;
            pwFixedRadio.disabled = disabled;
            fixedPasswordInput.disabled = disabled;
        }

        function updateStatus(status) {
            statusBadge.className = 'status-badge';

            if (status === 'running') {
                statusBadge.classList.add('status-running');
                statusText.innerText = 'Memproses';
                startBtn.disabled = true;
                stopBtn.disabled = false;
                setFormDisabled(true);
            } else if (status === 'success') {
                statusBadge.classList.add('status-success');
                statusText.innerText = 'Selesai';
                startBtn.disabled = false;
                stopBtn.disabled = true;
                setFormDisabled(false);
            } else if (status === 'idle') {
                statusBadge.classList.add('status-idle');
                statusText.innerText = 'Standby';
                startBtn.disabled = false;
                stopBtn.disabled = true;
                setFormDisabled(false);
            } else if (status === 'error') {
                statusBadge.classList.add('status-error');
                statusText.innerText = 'Error';
                startBtn.disabled = false;
                stopBtn.disabled = true;
                setFormDisabled(false);
            } else if (status === 'stopped') {
                statusBadge.className = 'status-badge status-idle';
                statusText.innerText = 'Dihentikan';
                startBtn.disabled = false;
                stopBtn.disabled = true;
                setFormDisabled(false);
            }
        }

        startBtn.addEventListener('click', () => {
            const url          = dropboxUrlInput.value.trim();
            const emails       = emailsListInput.value.trim();
            const useProxy     = useProxyCheckbox.checked;
            const useHeadless  = useHeadlessCheckbox.checked;
            const passwordMode = pwFixedRadio.checked ? 'fixed' : 'random';
            const fixedPassword = fixedPasswordInput.value.trim() || 'Aa12345678*';

            if (!emails) {
                alert('Silakan masukkan minimal satu alamat email!');
                return;
            }

            if (socket && socket.readyState === WebSocket.OPEN) {
                logPanel.innerHTML = '';
                successCountEl.innerText = '0';
                failedCountEl.innerText = '0';

                // Log client info
                appendLog('log-info', `[Info] User Agent: ${navigator.userAgent}`);
                fetch('https://api.ipify.org?format=json')
                    .then(res => res.json())
                    .then(data => appendLog('log-info', `[Info] Public IP (client): ${data.ip}`))
                    .catch(() => {});

                appendLog('log-info', `[Dashboard] Mode Password: ${passwordMode === 'fixed' ? 'Fixed (' + fixedPassword + ')' : 'Random'}`);
                appendLog('log-info', '[Dashboard] Mengirimkan data formulir registrasi...');

                socket.send(JSON.stringify({
                    action: 'start',
                    url,
                    emails,
                    useProxy,
                    useHeadless,
                    passwordMode,
                    fixedPassword
                }));
            } else {
                alert('WebSocket belum siap. Silakan muat ulang halaman.');
            }
        });

        stopBtn.addEventListener('click', () => {
            if (socket && socket.readyState === WebSocket.OPEN) {
                appendLog('log-warn', '[Dashboard] Mengirimkan perintah berhenti...');
                socket.send(JSON.stringify({ action: 'stop' }));
            }
        });

        clearBtn.addEventListener('click', () => { logPanel.innerHTML = ''; });
    </script>
</body>
</html>
